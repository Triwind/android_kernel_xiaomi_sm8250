name: Build Alioth AOSP Kernel (ReSukiSU + BBG + Droidspaces)

on:
  workflow_dispatch:
    inputs:
      toolchain:
        description: '选择 Clang 工具链'
        required: false
        default: 'zyc'
        type: choice
        options:
          - aosp
          - zyc
          - neutron
      lto_mode:
        description: 'LTO 优化模式 (thin/full/none)'
        required: false
        default: 'thin'
        type: choice
        options:
          - thin
          - full
          - none
      artifact_scope:
        description: '上传的产物范围'
        required: false
        default: 'compact'
        type: choice
        options:
          - compact
          - complete

env:
  KERNEL_DIR: ${{ github.workspace }}/kernel
  TC_AOSP_DIR: ${{ github.workspace }}/toolchain/aosp-clang
  TC_NEUTRON_DIR: ${{ github.workspace }}/toolchain/neutron-clang
  TC_ZYC_DIR: ${{ github.workspace }}/toolchain/zyc-clang
  OUT_DIR: ${{ github.workspace }}/kernel/out_aosp
  PATCH_DIR: ${{ github.workspace }}/patch_repo
  ANYKERNEL_DIR: ${{ github.workspace }}/anykernel
  AOSP_CLANG_TAG: r547379
  AOSP_CLANG_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # 1. 检出源码
      - name: 检出内核源码
        uses: actions/checkout@v6
        with:
          path: kernel
          fetch-depth: 1

      # 2. 检查可用磁盘空间
      - name: 检查剩余磁盘空间
        run: df -h /

      # 3. 配置虚拟内存 (Swap)
      - name: 设置额外的虚拟内存
        run: |
          LTO_MODE="${{ github.event.inputs.lto_mode || 'thin' }}"
          if [ "$LTO_MODE" = "full" ]; then
            SWAP_SIZE="8G"
          else
            SWAP_SIZE="4G"
          fi
          echo "正在添加 ${SWAP_SIZE} 的虚拟内存 (LTO 模式: ${LTO_MODE})..."
          sudo fallocate -l "$SWAP_SIZE" /swapfile_ci
          sudo chmod 600 /swapfile_ci
          sudo mkswap /swapfile_ci
          sudo swapon /swapfile_ci
          free -h

      # 4. 安装编译依赖
      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex gawk \
            git gnupg gperf imagemagick libncurses-dev \
            lib32readline-dev lib32z1-dev liblz4-tool \
            libsdl1.2-dev libssl-dev libelf-dev libxml2 libxml2-utils \
            lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 python-is-python3 llvm lld coccinelle \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      # 5. 工具链配置与缓存控制
      # 5.1 AOSP Clang
      - name: 缓存 AOSP Clang 工具链
        if: ${{ (github.event.inputs.toolchain || 'zyc') == 'aosp' }}
        id: cache-aosp
        uses: actions/cache@v5
        with:
          path: ${{ env.TC_AOSP_DIR }}
          key: aosp-clang-${{ env.AOSP_CLANG_TAG }}

      - name: 下载 AOSP Clang 工具链
        if: ${{ (github.event.inputs.toolchain || 'zyc') == 'aosp' && steps.cache-aosp.outputs.cache-hit != 'true' }}
        run: |
          mkdir -p "$TC_AOSP_DIR"
          curl -L --fail \
            "${AOSP_CLANG_URL}/+archive/refs/heads/main/clang-${AOSP_CLANG_TAG}.tar.gz" \
            -o /tmp/clang.tar.gz
          tar -xzf /tmp/clang.tar.gz -C "$TC_AOSP_DIR"
          rm -f /tmp/clang.tar.gz

      # 5.2 Neutron Clang
      - name: 获取当前周数 (用于 Neutron/ZyC 缓存校验)
        if: ${{ github.event.inputs.toolchain == 'neutron' || github.event.inputs.toolchain == 'zyc' }}
        id: get-date
        run: echo "date=$(date +'%Y-%U')" >> "$GITHUB_OUTPUT"

      - name: 缓存 Neutron Clang 工具链
        if: ${{ github.event.inputs.toolchain == 'neutron' }}
        id: cache-neutron
        uses: actions/cache@v5
        with:
          path: ${{ env.TC_NEUTRON_DIR }}
          key: neutron-clang-${{ steps.get-date.outputs.date }}
          restore-keys: |
            neutron-clang-

      - name: 下载 Neutron Clang 工具链
        if: ${{ github.event.inputs.toolchain == 'neutron' && steps.cache-neutron.outputs.cache-hit != 'true' }}
        run: |
          mkdir -p "$TC_NEUTRON_DIR"
          cd "$TC_NEUTRON_DIR"
          curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          ./antman -S

      # 5.3 ZyCromerZ Clang (默认)
      - name: 缓存 ZyC Clang 工具链
        if: ${{ (github.event.inputs.toolchain || 'zyc') == 'zyc' }}
        id: cache-zyc
        uses: actions/cache@v5
        with:
          path: ${{ env.TC_ZYC_DIR }}
          key: zyc-clang-${{ steps.get-date.outputs.date }}
          restore-keys: |
            zyc-clang-

      - name: 下载 ZyC Clang 工具链
        if: ${{ (github.event.inputs.toolchain || 'zyc') == 'zyc' && steps.cache-zyc.outputs.cache-hit != 'true' }}
        run: |
          mkdir -p "$TC_ZYC_DIR"
          echo "正在获取 ZyC Clang 最新下载链接..."
          ZYC_URL=$(curl -sSL "https://raw.githubusercontent.com/ZyCromerZ/Clang/main/Clang-main-link.txt" | head -n 1 | xargs)
          if [ -z "$ZYC_URL" ]; then
            echo "错误：无法解析 ZyC Clang 下载链接！" && exit 1
          fi
          echo "正在下载 ZyC Clang: $ZYC_URL"
          curl -L --fail "$ZYC_URL" -o /tmp/zyc_clang.tar.gz
          tar -xzf /tmp/zyc_clang.tar.gz -C "$TC_ZYC_DIR"
          rm -f /tmp/zyc_clang.tar.gz

      # 6. 克隆 Droidspaces 补丁仓库
      - name: 克隆补丁仓库
        run: |
          git clone --depth=1 https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd.git -b mainline "${{ env.PATCH_DIR }}"

      # 7. 配置 ccache 编译缓存
      - name: 缓存 ccache 数据
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache_mikernel
          key: ccache-alioth-aosp-${{ github.event.inputs.toolchain || 'zyc' }}-${{ github.run_id }}
          restore-keys: |
            ccache-alioth-aosp-${{ github.event.inputs.toolchain || 'zyc' }}-
            ccache-alioth-aosp-

      - name: 初始化 ccache 设置
        run: |
          export CCACHE_DIR=~/.cache/ccache_mikernel
          mkdir -p "$CCACHE_DIR"
          ccache -M 5G
          ccache -z

      # 8. 配置工具链环境变量 PATH
      - name: 配置工具链环境变量 PATH
        run: |
          TOOLCHAIN_CHOICE="${{ github.event.inputs.toolchain || 'zyc' }}"
          if [ "$TOOLCHAIN_CHOICE" = "neutron" ]; then
            echo "激活编译器: Neutron Clang"
            echo "$TC_NEUTRON_DIR/bin" >> "$GITHUB_PATH"
          elif [ "$TOOLCHAIN_CHOICE" = "aosp" ]; then
            echo "激活编译器: AOSP Clang"
            echo "$TC_AOSP_DIR/bin" >> "$GITHUB_PATH"
          else
            echo "激活编译器: ZyCromerZ Clang"
            echo "$TC_ZYC_DIR/bin" >> "$GITHUB_PATH"
          fi

      - name: 显示工具链详细信息
        run: |
          which clang
          clang --version

      # 9. 准备产物名称
      - name: 准备产物名称
        id: meta
        if: always()
        run: |
          DATE_STR=$(TZ='Asia/Shanghai' date +'%Y%m%d_%H%M')
          TOOLCHAIN_LABEL="${{ github.event.inputs.toolchain || 'zyc' }}"
          LTO_LABEL="${{ github.event.inputs.lto_mode || 'thin' }}"
          echo "base_name=APTKernel_AOSP_alioth_ReSukiSU-SuSFS_BBG_Droid_${TOOLCHAIN_LABEL}_lto-${LTO_LABEL}-${{ github.run_number }}-${DATE_STR}" >> "$GITHUB_OUTPUT"

      # 10. 执行内核编译
      - name: 编译内核主体
        id: build
        run: |
          START_TIME=$(date +%s)
          cd "$KERNEL_DIR"
          chmod +x build_kernel.sh
          
          LTO_MODE="${{ github.event.inputs.lto_mode || 'thin' }}"
          TOOLCHAIN_CHOICE="${{ github.event.inputs.toolchain || 'zyc' }}"
          
          echo "=== 开始编译 alioth AOSP 内核 (KSU + SUSFS + BBG + Droidspaces) ==="
          echo "工具链: $TOOLCHAIN_CHOICE | LTO: $LTO_MODE"
          
          LOG_FILE="${{ github.workspace }}/build.log"
          ./build_kernel.sh alioth "$LTO_MODE" "$TOOLCHAIN_CHOICE" "$PATCH_DIR" 2>&1 | tee "$LOG_FILE"
          BUILD_EXIT=${PIPESTATUS[0]}
          
          ccache -s | tee -a "$LOG_FILE"
          
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          MIN=$((DURATION / 60))
          SEC=$((DURATION % 60))
          
          echo "duration_min=${MIN}" >> "$GITHUB_OUTPUT"
          echo "duration_sec=${SEC}" >> "$GITHUB_OUTPUT"
          echo "toolchain=${TOOLCHAIN_CHOICE}" >> "$GITHUB_OUTPUT"
          echo "lto_mode=${LTO_MODE}" >> "$GITHUB_OUTPUT"
          
          exit "$BUILD_EXIT"

      # 11. 校验编译输出产物
      - name: 校验编译输出
        run: |
          if [ -f "$OUT_DIR/arch/arm64/boot/Image" ]; then
            echo "=== 编译成功：内核 Image 已生成 ==="
          else
            echo "=== 编译失败：未找到内核 Image 文件 ===" && exit 1
          fi

      # 12. 上传刷入包 (AnyKernel3 ZIP)
      - name: 上传 AnyKernel3 刷入包 (ZIP)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.base_name }}-Flashable
          path: ${{ github.workspace }}/APTKernel_*.zip
          if-no-files-found: error
          retention-days: 14

      # 13. 上传内核镜像 (compact - boot 文件夹)
      - name: 上传内核镜像 (compact - boot 文件夹)
        if: ${{ (github.event.inputs.artifact_scope || 'compact') == 'compact' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.base_name }}-boot
          path: ${{ env.OUT_DIR }}/arch/arm64/boot
          if-no-files-found: warn
          retention-days: 14

      # 14. 上传全量构建包 (complete - 整个 out 目录)
      - name: 上传内核构建包 (complete - 整个 out 目录)
        if: ${{ github.event.inputs.artifact_scope == 'complete' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.base_name }}-out
          path: ${{ env.OUT_DIR }}
          if-no-files-found: warn
          retention-days: 7

      # 15. 上传全量编译日志
      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.base_name }}-log
          path: ${{ github.workspace }}/build.log
          if-no-files-found: warn
          retention-days: 14

      # 16. 上传最终配置
      - name: 上传最终配置
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.base_name }}-config
          path: ${{ env.OUT_DIR }}/.config
          if-no-files-found: warn
          retention-days: 14

      # 17. 写入编译摘要
      - name: 写入编译摘要
        if: always()
        run: |
          {
            echo "## Alioth AOSP 内核编译摘要"
            echo ""
            echo "| 项目 | 配置参数值 |"
            echo "|---|---|"
            echo "| 设备 | \`alioth\` |"
            echo "| 目标系统 | \`AOSP\` |"
            echo "| 所用工具链 | \`${{ steps.build.outputs.toolchain }}\\` |"
            echo "| LTO 优化模式 | \`${{ steps.build.outputs.lto_mode }}\\` |"
            echo "| 实际编译耗时 | **${{ steps.build.outputs.duration_min }} 分 ${{ steps.build.outputs.duration_sec }} 秒** |"
            echo "| ReSukiSU (KSU+SUSFS) | **已启用** |"
            echo "| Baseband-guard | **已启用** |"
            echo "| Droidspaces | **已注入** |"
            echo "| 任务最终状态 | **${{ job.status }}** |"
          } >> "$GITHUB_STEP_SUMMARY"
